services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      DB_PATH: /app/data/portfolio.db
    volumes:
      - ./static/uploads:/app/static/uploads
      - portfolio-db:/app/data

volumes:
  portfolio-db:
