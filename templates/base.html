<!DOCTYPE html>
<html lang="en" class="h-full">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{% block title %}Photo Portfolio{% endblock %}</title>
<script src="https://cdn.tailwindcss.com"></script></head>
<body class="h-full bg-neutral-950 text-neutral-100 antialiased">
<header class="border-b border-neutral-800/80 sticky top-0 z-10 bg-neutral-950/80 backdrop-blur">
<div class="mx-auto max-w-7xl px-6 py-5 flex items-center justify-between">
<a href="/" class="text-lg font-semibold tracking-tight">Photo<span class="text-neutral-500">Portfolio</span></a>
<nav class="flex items-center gap-6 text-sm text-neutral-400"><a href="/" class="hover:text-white transition">Gallery</a>
{% block nav_extra %}<a href="/admin" class="hover:text-white transition">Admin</a>{% endblock %}</nav></div></header>
<main class="mx-auto max-w-7xl px-6 py-12">{% block content %}{% endblock %}</main>
<footer class="border-t border-neutral-800/80 mt-16"><div class="mx-auto max-w-7xl px-6 py-8 text-sm text-neutral-500">
Built with FastAPI, SQLite and Pillow.</div></footer></body></html>
